<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Chat Socket.IO UNA</title>
    <link rel="stylesheet" href="/chat.css">
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="nombre" autocomplete="off" placeholder="Username" maxlength="30"/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" maxlength="500" /><button>Send</button>
    </form>
    <!-- cliente socket.io servido por el propio servidor (sin CDN externo) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>
