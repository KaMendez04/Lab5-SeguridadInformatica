# Pipeline DevSecOps de UNA-chat.
# Los jobs se encadenan con `needs:`: si uno falla, los siguientes no se ejecutan.
name: CI DevSecOps

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1. Calidad y reglas de seguridad estaticas del codigo JS
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # 2. Pruebas unitarias BDD (Dado-Cuando-Entonces)
  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # 3. SAST (Semgrep + Snyk Code) y SCA (Snyk Open Source)
  sast:
    name: sast
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # subir SARIF a la pestaña Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Instalar Semgrep y Snyk
        run: |
          pipx install semgrep
          npm install -g snyk

      - name: Semgrep (reglas auto + reglas propias)
        id: semgrep
        run: semgrep scan --config auto --config .semgrep.yml --error --sarif --output semgrep.sarif

      - name: OWASP checker (proyecto completo)
        if: ${{ !cancelled() }}
        run: node scripts/owasp-checker.js --all

      - name: Snyk Open Source (dependencias)
        id: snyk_deps
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --sarif-file-output=snyk-deps.sarif

      - name: Snyk Code (SAST)
        id: snyk_code
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Subir SARIF de Semgrep a GitHub Security
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Subir SARIF de Snyk Code a GitHub Security
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Subir SARIF de Snyk Open Source a GitHub Security
        if: ${{ !cancelled() && hashFiles('snyk-deps.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-open-source

  # 4. Build de la imagen, escaneo con Trivy y push a Docker Hub (solo push a development)
  container:
    name: container
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_NAME: bluelemon08/una-chat   # Docker Hub exige minusculas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build de la imagen (sin publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

      - name: Trivy - reporte SARIF para GitHub Security
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Subir SARIF de Trivy a GitHub Security
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy - quality gate (falla con CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-setup-trivy: true

      # Solo se publica si Trivy paso y es un push a development
      - name: Login a Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push a Docker Hub (tag development)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:development"
          docker push "$IMAGE_NAME:development"
          docker push "$IMAGE_NAME:$GITHUB_SHA"

  # 5. Despliegue continuo en Render (solo push a development)
  deploy:
    name: deploy
    needs: container
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar el Deploy Hook de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null

      - name: Esperar a que Render sirva este commit
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 60); do
            v=$(curl -fsS --max-time 15 "$APP_URL/healthz" | jq -r .version || true)
            echo "intento $i: version desplegada=${v:-sin respuesta}"
            if [ "$v" = "$GITHUB_SHA" ]; then echo "Deploy listo: $APP_URL"; exit 0; fi
            sleep 10
          done
          echo "::error::Render no sirvio la version $GITHUB_SHA en 10 minutos"
          exit 1

  # 6. DAST con Nuclei contra la app desplegada
  dast:
    name: dast
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Instalar Nuclei
        uses: projectdiscovery/nuclei-action@32a91c0da7be14c07b0ade6c14fa0f6e78d97c9c # v3.1.0
        with:
          version: v3.11.1
          install-only: true

      # -rl 1: 1 peticion/seg para no chocar con el rate limit de la app (100/min)
      - name: Nuclei - cabeceras, CORS, SSL, CSP y cookies (todas las severidades)
        run: |
          nuclei -u "$APP_URL" -tags headers,cors,ssl,csp,cookie \
            -rl 1 -c 5 -nc -stats -si 60 \
            -je nuclei-headers.json -me nuclei-report

      - name: Nuclei - exposiciones y malas configuraciones HIGH/CRITICAL
        run: |
          nuclei -u "$APP_URL" -tags exposure,misconfig -s high,critical \
            -etags intrusive,dos,fuzz,wordpress,wp-plugin,cve \
            -rl 1 -c 5 -nc -stats -si 60 \
            -je nuclei-exposures.json -me nuclei-report

      - name: Resumen y quality gate (falla con HIGH/CRITICAL)
        run: |
          for f in nuclei-headers.json nuclei-exposures.json; do [ -s "$f" ] || echo '[]' > "$f"; done
          jq -s 'add' nuclei-headers.json nuclei-exposures.json > nuclei-results.json
          {
            echo "## Nuclei DAST contra $APP_URL"
            echo "| Severidad | Plantilla | URL |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.info.severity) | \(.["template-id"]) | \(.["matched-at"]) |"' nuclei-results.json
          } >> "$GITHUB_STEP_SUMMARY"
          altos=$(jq '[.[] | select(.info.severity=="high" or .info.severity=="critical")] | length' nuclei-results.json)
          echo "Hallazgos HIGH/CRITICAL: $altos"
          [ "$altos" -eq 0 ]

      - name: Subir reporte de Nuclei
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuclei-report
          path: |
            nuclei-results.json
            nuclei-report/
          if-no-files-found: warn

  # 7. Pruebas E2E con Playwright: contra Render en push a development,
  #    contra un servidor local en los pull requests
  e2e:
    name: e2e
    needs: [container, deploy]
    if: ${{ !cancelled() && needs.container.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      APP_URL: ${{ needs.deploy.result == 'success' && vars.APP_URL || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: |
          echo "Probando contra: ${APP_URL:-servidor local}"
          npx playwright test
      - name: Subir reporte HTML de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
