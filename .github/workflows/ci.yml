# Pipeline DevSecOps de UNA-chat.
# Los jobs se encadenan con `needs:`: si uno falla, los siguientes no se ejecutan.
name: CI DevSecOps

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1. Calidad y reglas de seguridad estaticas del codigo JS
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # 2. Pruebas unitarias BDD (Dado-Cuando-Entonces)
  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # 3. SAST (Semgrep + Snyk Code) y SCA (Snyk Open Source)
  sast:
    name: sast
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # subir SARIF a la pestaña Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Instalar Semgrep y Snyk
        run: |
          pipx install semgrep
          npm install -g snyk

      - name: Semgrep (reglas auto + reglas propias)
        id: semgrep
        run: semgrep scan --config auto --config .semgrep.yml --error --sarif --output semgrep.sarif

      - name: OWASP checker (proyecto completo)
        if: ${{ !cancelled() }}
        run: node scripts/owasp-checker.js --all

      - name: Snyk Open Source (dependencias)
        id: snyk_deps
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --sarif-file-output=snyk-deps.sarif

      - name: Snyk Code (SAST)
        id: snyk_code
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Subir SARIF de Semgrep a GitHub Security
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Subir SARIF de Snyk Code a GitHub Security
        if: ${{ !cancelled() && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Subir SARIF de Snyk Open Source a GitHub Security
        if: ${{ !cancelled() && hashFiles('snyk-deps.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-deps.sarif
          category: snyk-open-source

  # 4. Build de la imagen, escaneo con Trivy y push a Docker Hub (solo push a development)
  container:
    name: container
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_NAME: bluelemon08/una-chat   # Docker Hub exige minusculas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build de la imagen (sin publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy - reporte SARIF para GitHub Security
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Subir SARIF de Trivy a GitHub Security
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy - quality gate (falla con CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-setup-trivy: true

      # Solo se publica si Trivy paso y es un push a development
      - name: Login a Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push a Docker Hub (tag development)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
        run: |
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:development"
          docker push "$IMAGE_NAME:development"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
